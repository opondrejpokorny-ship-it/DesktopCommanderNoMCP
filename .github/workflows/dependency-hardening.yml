name: Dependency hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
  DC_DISABLE_INSTALL_TELEMETRY: '1'

jobs:
  package-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run dependency hardening gates
        run: |
          node test/test-runtime-dependency-security.js
          node test/test-transitive-runtime-security.js
          node test/test-pdf-dependency-hygiene.js
          node test/test-pdf-runtime-compat.js
          node test/test-excel-dependency-security.js
          node test/test-excel-transitive-compat.js
          node test/test-production-dependency-deprecations.js
          node test/test-package-publish-safety.js
          node test/test-node-local-vendored-import.js
          node scripts/verify-vendor-provenance.cjs
          node scripts/verify-vendor-upstream.cjs

      - name: Verify packaged consumer
        run: npm run test:package-consumer

      - name: Runtime audit
        run: npm audit --omit=dev

      - name: Diff hygiene
        run: git diff --check
